services:
  postgres:
    image: postgres:16-alpine
    container_name: centro-postgres
    environment:
      POSTGRES_USER: centro
      POSTGRES_PASSWORD: centro
      POSTGRES_DB: centro
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centro -d centro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
